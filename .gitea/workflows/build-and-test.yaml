name: WASM Build & Frontend Test

on:
  push:
  pull_request:
    branches: [ main, master ]

jobs:
  verify-project:
    runs-on: ubuntu-latest

    steps:
      # 1. Clone the repository code into the CI environment
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Zig Compiler
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      # 3. Setup Node.js & NPM
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './web/package-lock.json'

      # 4. Compile Zig to WebAssembly
      - name: Build WebAssembly Core
        working-directory: ./wasm
        run: |
          zig build wasm

      # 5. Install JS Dependencies & Run Frontend Checks
      - name: Install & Test Frontend
        working-directory: ./web
        run: |
          npm ci
          npm run build
          npm test